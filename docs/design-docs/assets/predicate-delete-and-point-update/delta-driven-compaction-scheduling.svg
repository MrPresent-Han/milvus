<svg xmlns="http://www.w3.org/2000/svg" width="920" height="394" viewBox="0 0 920 394" role="img" aria-labelledby="title desc">
  <title id="title">Delta 对 full rewrite 调度的两类输入</title>
  <desc id="desc">QN 从已执行的 DeletedRecord 提供累计删除行数，MixCoord 通过独立 stats RPC 周期采集到内存 cache。MixCoord 读取持久化 delta 的 pending predicate 数量、update 数据量及既有文件信号。积压达到阈值可独立产生候选，经过 range 隔离准入后交给 DN full rewrite。</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#496a77"/></marker>
  </defs>
  <style>
    text{font:18px "PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#233e49;text-anchor:middle}
    .head{font-size:20px;font-weight:650}
    .small{font-size:16px;fill:#48606c}
    .flow{fill:none;stroke:#496a77;stroke-width:2;marker-end:url(#arrow)}
  </style>
  <rect width="920" height="394" rx="12" fill="#f4f8f9"/>
  <rect x="20" y="22" width="380" height="90" rx="8" fill="#fff" stroke="#b5cbd4"/>
  <text x="210" y="53" class="head">QN · loaded sealed segment</text>
  <text x="210" y="81">DeletedRecord 累计实际删除行数</text>
  <text x="210" y="102" class="small">按 row offset 去重</text>
  <path d="M400 67H509" class="flow"/>
  <text x="460" y="40" class="small">独立 stats RPC</text>
  <rect x="516" y="22" width="384" height="90" rx="8" fill="#e9f2f6" stroke="#b1c7d1"/>
  <text x="708" y="53" class="head">MixCoord · stats cache</text>
  <text x="708" y="82">累计观测、执行进度、segment 身份</text>
  <text x="708" y="103" class="small">周期采集 · 缺失时走 fallback</text>
  <rect x="20" y="160" width="380" height="91" rx="8" fill="#fff" stroke="#b5cbd4"/>
  <text x="210" y="184" class="head">Segment · pending deltas</text>
  <text x="210" y="211">predicate 数量／update 数据量</text>
  <text x="210" y="236" class="small">文件数量、大小等既有信号</text>
  <path d="M708 112V154" class="flow"/>
  <path d="M400 205H509" class="flow"/>
  <rect x="516" y="160" width="384" height="91" rx="8" fill="#dcefeb" stroke="#5c988e" stroke-width="1.5"/>
  <text x="708" y="184" class="head">MixCoord · full rewrite 调度</text>
  <text x="708" y="211">删除比例／积压／既有条件</text>
  <text x="708" y="236" class="small">任一触发 → 候选</text>
  <path d="M708 251V291" class="flow"/>
  <text x="809" y="277" class="small">§5.2.3 准入</text>
  <rect x="516" y="297" width="384" height="75" rx="8" fill="#fff" stroke="#b5cbd4"/>
  <text x="708" y="327" class="head">DN full rewrite</text>
  <text x="708" y="353">按 plan 执行完整适用 delta 前缀</text>
</svg>
