<svg xmlns="http://www.w3.org/2000/svg" width="880" height="270" viewBox="0 0 880 270" role="img" aria-labelledby="title desc">
  <title id="title">Segment 的两种 mutation operator plan</title>
  <desc id="desc">predicate DELETE 依次执行 PhyFilterBitsNode、PhyMvccNode、ApplyDeltaNode。PK DELETE 和 PK inplace-update 只执行 ApplyDeltaNode，由它在内部调用 segment 的 PK lookup。</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#42626d"/></marker>
  </defs>
  <style>
    text{font:19px "PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#233e49}
    .caption{font-weight:650}
    .op{text-anchor:middle;font-family:"SFMono-Regular",Consolas,monospace;font-size:19px}
    .read{fill:#fff;stroke:#a9c0ca}
    .apply{fill:#dcefeb;stroke:#3d8178;stroke-width:1.6}
    .flow{stroke:#42626d;stroke-width:2;marker-end:url(#arrow)}
  </style>
  <rect width="880" height="270" rx="12" fill="#f4f8f9"/>
  <text x="28" y="37" class="caption">predicate DELETE</text>
  <rect x="28" y="55" width="223" height="54" rx="7" class="read"/>
  <text x="140" y="89" class="op">PhyFilterBitsNode</text>
  <line x1="252" y1="82" x2="314" y2="82" class="flow"/>
  <rect x="320" y="55" width="223" height="54" rx="7" class="read"/>
  <text x="432" y="89" class="op">PhyMvccNode</text>
  <line x1="544" y1="82" x2="606" y2="82" class="flow"/>
  <rect x="612" y="55" width="240" height="54" rx="7" class="apply"/>
  <text x="732" y="89" class="op">ApplyDeltaNode</text>
  <line x1="28" y1="134" x2="852" y2="134" stroke="#cddde3"/>
  <text x="28" y="177" class="caption">PK DELETE / PK inplace-update</text>
  <rect x="28" y="195" width="223" height="54" rx="7" class="apply"/>
  <text x="140" y="229" class="op">ApplyDeltaNode</text>
</svg>
