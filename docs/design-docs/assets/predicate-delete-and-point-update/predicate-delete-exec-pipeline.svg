<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1150" viewBox="0 0 1100 1150" role="img" aria-labelledby="title desc">
  <title id="title">Predicate DELETE 的 exec framework pipeline 构造与执行</title>
  <desc id="desc">Segment 接收 typed predicate 与 mutation_ts，构造 FilterBitsNode、MvccNode 和拟新增 DeleteApplyNode 的 PlanFragment。Task 使用 LocalPlanner 与 DriverFactory 将 plan 构造为 physical operators。表达式读取 base/index 加 UpdatesRecord，结果经过 MVCC 与删除资格检查后，通过拟新增 ApplyDeletesMap 写入 DeletedRecord。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#718795"/></marker>
  </defs>
  <rect width="1100" height="1150" rx="14" fill="#f7fafb"/>
  <g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#243e4a">
    <text x="28" y="46" font-size="28" font-weight="600">Predicate DELETE：构造 plan，再执行删除 pipeline</text>
    <g font-size="20">
      <rect x="28" y="69" width="22" height="19" fill="#e5edf6" stroke="#94abc3"/>
      <text x="61" y="86" fill="#496c76">复用 exec framework</text>
      <rect x="358" y="69" width="22" height="19" fill="#fff1df" stroke="#d2ad7f"/>
      <text x="391" y="86" fill="#946c32">拟新增 mutation 入口与删除节点</text>
    </g>

    <g id="plan-construction">
      <rect x="28" y="112" width="1044" height="438" rx="10" fill="#fff" stroke="#d3e0e6"/>
      <text x="48" y="151" font-size="24" font-weight="600">① Pipeline 构造：typed predicate → PlanFragment → Driver</text>
      <rect x="48" y="176" width="1004" height="61" rx="7" fill="#fff1df" stroke="#d2ad7f"/>
      <text x="550" y="214" text-anchor="middle" font-size="22">Segment mutation 入口：typed predicate ＋ mutation_ts</text>
      <path d="M196 239V272" fill="none" stroke="#718795" stroke-width="2" marker-end="url(#arrow)"/>
      <text x="402" y="272" font-size="20" fill="#617984">PlanFragment：串联三个 PlanNodes</text>
      <g text-anchor="middle">
        <rect x="48" y="284" width="296" height="64" rx="7" fill="#e5edf6" stroke="#94abc3"/>
        <text x="196" y="323" font-size="22" font-weight="600">FilterBitsNode</text>
        <rect x="402" y="284" width="296" height="64" rx="7" fill="#e5edf6" stroke="#94abc3"/>
        <text x="550" y="323" font-size="22" font-weight="600">MvccNode</text>
        <rect x="756" y="284" width="296" height="64" rx="7" fill="#fff1df" stroke="#d2ad7f"/>
        <text x="904" y="323" font-size="22" font-weight="600">DeleteApplyNode</text>
      </g>
      <path d="M346 316H389" fill="none" stroke="#718795" stroke-width="2" marker-end="url(#arrow)"/>
      <path d="M700 316H743" fill="none" stroke="#718795" stroke-width="2" marker-end="url(#arrow)"/>
      <path d="M904 349V377H196V399" fill="none" stroke="#718795" stroke-width="2" marker-end="url(#arrow)"/>
      <g text-anchor="middle">
        <rect x="48" y="411" width="296" height="78" rx="7" fill="#e5edf6" stroke="#94abc3"/>
        <text x="196" y="444" font-size="22" font-weight="600">Task</text>
        <text x="196" y="475" font-size="20">Create / Next</text>
        <rect x="402" y="411" width="296" height="78" rx="7" fill="#e5edf6" stroke="#94abc3"/>
        <text x="550" y="444" font-size="22" font-weight="600">LocalPlanner::Plan</text>
        <text x="550" y="475" font-size="20">生成 DriverFactory</text>
        <rect x="756" y="411" width="296" height="78" rx="7" fill="#e5edf6" stroke="#94abc3"/>
        <text x="904" y="444" font-size="22" font-weight="600">DriverFactory</text>
        <text x="904" y="475" font-size="20">CreateDriver</text>
      </g>
      <path d="M346 450H389" fill="none" stroke="#718795" stroke-width="2" marker-end="url(#arrow)"/>
      <path d="M700 450H743" fill="none" stroke="#718795" stroke-width="2" marker-end="url(#arrow)"/>
      <text x="48" y="525" font-size="20" fill="#617984">新增 DeleteApplyNode → PhyDeleteApplyNode 的映射，复用其余 plan／operator 构造链路。</text>
    </g>

    <g id="physical-pipeline">
      <path d="M904 489V572H550V602" fill="none" stroke="#718795" stroke-width="2" marker-end="url(#arrow)"/>
      <rect x="28" y="610" width="1044" height="512" rx="10" fill="#fff" stroke="#d3e0e6"/>
      <text x="48" y="649" font-size="24" font-weight="600">② Driver 执行：predicate 结果 → 适用 offsets → DeletedRecord</text>
      <rect x="48" y="676" width="296" height="61" rx="7" fill="#e1f1ed" stroke="#80b5a9"/>
      <text x="196" y="702" text-anchor="middle" font-size="21">base/index</text>
      <text x="196" y="728" text-anchor="middle" font-size="21">＋ UpdatesRecord</text>
      <text x="374" y="702" font-size="20" fill="#617984">读取 mutation 时刻的字段值</text>
      <text x="374" y="732" font-size="20" fill="#617984">包含此前已生效的 updates</text>
      <path d="M196 738V772" fill="none" stroke="#718795" stroke-width="2" marker-end="url(#arrow)"/>
      <g text-anchor="middle">
        <rect x="48" y="784" width="296" height="110" rx="7" fill="#e5edf6" stroke="#94abc3"/>
        <text x="196" y="821" font-size="22" font-weight="600">PhyFilterBitsNode</text>
        <text x="196" y="858" font-size="21">ExprSet 求值 predicate</text>
        <rect x="402" y="784" width="296" height="110" rx="7" fill="#e5edf6" stroke="#94abc3"/>
        <text x="550" y="821" font-size="22" font-weight="600">PhyMvccNode</text>
        <text x="550" y="858" font-size="21">可见性与删除状态过滤</text>
        <rect x="756" y="784" width="296" height="110" rx="7" fill="#fff1df" stroke="#d2ad7f"/>
        <text x="904" y="821" font-size="22" font-weight="600">PhyDeleteApplyNode</text>
        <text x="904" y="858" font-size="21">检查 DELETE 时间资格</text>
      </g>
      <path d="M346 839H389" fill="none" stroke="#718795" stroke-width="2" marker-end="url(#arrow)"/>
      <path d="M700 839H743" fill="none" stroke="#718795" stroke-width="2" marker-end="url(#arrow)"/>
      <path d="M904 895V929" fill="none" stroke="#718795" stroke-width="2" marker-end="url(#arrow)"/>
      <rect x="48" y="941" width="1004" height="146" rx="8" fill="#fff1df" stroke="#d2ad7f"/>
      <text x="70" y="979" font-size="23" font-weight="600">ApplyDeletesMap（拟新增共同 offset-apply 入口）</text>
      <text x="70" y="1017" font-size="21">predicate 为 TRUE ＋ 行仍存活 ＋ row_ts &lt; mutation_ts</text>
      <text x="70" y="1055" font-size="22" font-weight="600">适用 offsets ＋ mutation_ts → DeletedRecord</text>
    </g>
  </g>
</svg>
