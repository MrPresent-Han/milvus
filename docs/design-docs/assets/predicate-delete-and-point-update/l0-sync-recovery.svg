<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="790" viewBox="0 0 1100 790" role="img" aria-labelledby="title desc">
<title id="title">正常 retry 与 crash recovery</title><desc id="desc">正常失败只重试 Fn 并复用输出 ID；crash 后先 fence 旧 owner，再读取持久化 M，保留已发布 L0，标记 M 之后的未发布 L0 Dropped，再从 WAL 重建，垃圾异步清理。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L8 4.5L0 9" fill="none" stroke="#718795" stroke-width="1.6"/></marker></defs>
<rect width="1100" height="790" rx="12" fill="#f7fafb"/>
<g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#243e4a">
<text x="36" y="48" font-size="26" fill="#243e4a" font-weight="600" text-anchor="start">正常 retry 保留完成位置；crash recovery 以持久化 M 为准</text>
<rect x="28" y="80" width="505" height="675" rx="8" fill="#eef4f5" stroke="#c5d7df"/>
<rect x="559" y="80" width="513" height="675" rx="8" fill="#eef4f5" stroke="#c5d7df"/>
<text x="280" y="125" font-size="25" fill="#243e4a" font-weight="600" text-anchor="middle">正常 retry</text>
<text x="815" y="125" font-size="25" fill="#243e4a" font-weight="600" text-anchor="middle">Crash recovery</text>
<rect x="50" y="150" width="461" height="64" rx="8" fill="#e7f3f1" stroke="#88b7b4"/>
<text x="280" y="191" font-size="22" fill="#243e4a" font-weight="400" text-anchor="middle">F1 已完成：保留输出和 ID</text>
<path d="M280 218V246" fill="none" stroke="#718795" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="50" y="257" width="461" height="118" rx="8" fill="#fff5e9" stroke="#c9955e"/>
<text x="280" y="294" font-size="24" fill="#243e4a" font-weight="600" text-anchor="middle">F2 失败：只重试 F2</text>
<text x="280" y="329" font-size="21" fill="#243e4a" font-weight="400" text-anchor="middle">复用 segment ID／LogID／内容</text>
<text x="280" y="360" font-size="21" fill="#243e4a" font-weight="400" text-anchor="middle">写入与登记幂等</text>
<path d="M280 379V410" fill="none" stroke="#718795" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="50" y="421" width="461" height="64" rx="8" fill="white" stroke="#b7cdd6"/>
<text x="280" y="462" font-size="23" fill="#243e4a" font-weight="400" text-anchor="middle">F2 成功后才开始 F3</text>
<path d="M280 489V520" fill="none" stroke="#718795" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="50" y="531" width="461" height="110" rx="8" fill="#e7f3f1" stroke="#88b7b4"/>
<text x="280" y="571" font-size="23" fill="#243e4a" font-weight="600" text-anchor="middle">全部输出完成 → 持久化 M</text>
<text x="280" y="610" font-size="21" fill="#243e4a" font-weight="400" text-anchor="middle">仅 M 发布失败：只 retry M</text>
<text x="280" y="698" font-size="20" fill="#617984" font-weight="400" text-anchor="middle">range／完成位置保留在 task 内存中</text>
<rect x="580" y="150" width="470" height="82" rx="8" fill="white" stroke="#b7cdd6"/>
<text x="815" y="184" font-size="21" fill="#243e4a" font-weight="600" text-anchor="middle">Fence 旧 owner 的 L0 登记与 M 发布</text>
<text x="815" y="216" font-size="21" fill="#243e4a" font-weight="400" text-anchor="middle">然后读取权威的持久化 M</text>
<path d="M815 236V267" fill="none" stroke="#718795" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="580" y="278" width="470" height="68" rx="8" fill="#e7f3f1" stroke="#88b7b4"/>
<text x="815" y="321" font-size="22" fill="#243e4a" font-weight="400" text-anchor="middle">sync_end ≤ M：沿用已发布输出</text>
<rect x="580" y="374" width="470" height="92" rx="8" fill="#fff5e9" stroke="#c9955e"/>
<text x="815" y="411" font-size="23" fill="#243e4a" font-weight="600" text-anchor="middle">sync_end &gt; M：未发布输出</text>
<text x="815" y="447" font-size="21" fill="#243e4a" font-weight="400" text-anchor="middle">先将这些 L0 持久化标为 Dropped</text>
<path d="M815 470V510" fill="none" stroke="#718795" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="580" y="521" width="470" height="105" rx="8" fill="white" stroke="#b7cdd6"/>
<text x="815" y="561" font-size="23" fill="#243e4a" font-weight="600" text-anchor="middle">完成清理标记后 replay WAL</text>
<text x="815" y="601" font-size="22" fill="#243e4a" font-weight="400" text-anchor="middle">只重建 ts &gt; M 的 delta</text>
<text x="815" y="679" font-size="20" fill="#617984" font-weight="400" text-anchor="middle">Dropped L0 → 既有 GC 异步回收文件</text>
<text x="815" y="712" font-size="20" fill="#617984" font-weight="400" text-anchor="middle">不等待物理 GC 才重建</text>
</g></svg>
