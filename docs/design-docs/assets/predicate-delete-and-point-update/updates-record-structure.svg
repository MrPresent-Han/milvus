<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1000" viewBox="0 0 1100 1000" role="img" aria-labelledby="title desc">
  <title id="title">UpdatesRecord：按字段、row offset 和 mutation_ts 组织稀疏版本</title>
  <desc id="desc">UpdatesRecord 为每个被更新字段保存 FieldUpdates。FieldUpdates 使用 B-tree 将 segment row offset 映射到独立的 cell history；history 使用 deque 按 mutation_ts 追加版本。示例中 offset 42 的 count 在 100、140、170 时分别更新为 20、NULL、25；Q_TS 为 150 时读取 NULL。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#718795"/></marker>
  </defs>
  <rect width="1100" height="1000" rx="14" fill="#f7fafb"/>
  <g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#243e4a">
    <text x="28" y="46" font-size="28" font-weight="600">UpdatesRecord：只为被更新的 cell 保存版本</text>

    <g id="field-directory">
      <rect x="28" y="80" width="252" height="386" rx="10" fill="#fff" stroke="#d3e0e6"/>
      <text x="48" y="120" font-size="23" font-weight="600">UpdatesRecord</text>
      <text x="48" y="154" font-size="21" fill="#617984">按 field_id 组织</text>
      <rect x="46" y="184" width="216" height="76" rx="7" fill="#e1f1ed" stroke="#80b5a9"/>
      <text x="64" y="215" font-size="22" font-weight="600">105 → count</text>
      <text x="64" y="245" font-size="20">FieldUpdates</text>
      <rect x="46" y="284" width="216" height="76" rx="7" fill="#e5edf6" stroke="#94abc3"/>
      <text x="64" y="315" font-size="22" font-weight="600">103 → checked</text>
      <text x="64" y="345" font-size="20">FieldUpdates</text>
      <text x="48" y="404" font-size="20" fill="#617984">未修改字段仍读 base</text>
      <text x="48" y="437" font-size="20" fill="#617984">各字段独立组织 history</text>
      <path d="M262 222H310" fill="none" stroke="#718795" stroke-width="2" marker-end="url(#arrow)"/>
    </g>

    <g id="offset-directory">
      <rect x="316" y="80" width="756" height="386" rx="10" fill="#fff" stroke="#d3e0e6"/>
      <text x="338" y="120" font-size="23" font-weight="600">FieldUpdates：count</text>
      <text x="338" y="154" font-size="20" fill="#617984">field-level RW lock 保护该字段的目录与 histories</text>
      <rect x="338" y="179" width="712" height="252" rx="8" fill="#f5f9fb" stroke="#b7cad4"/>
      <text x="356" y="214" font-size="21" font-weight="600">absl::btree_map&lt;offset, HistoryHandle&gt;</text>
      <text x="368" y="251" font-size="20" fill="#617984">segment row offset</text>
      <text x="738" y="251" font-size="20" fill="#617984">独立的 cell history</text>
      <path d="M356 264H1030" fill="none" stroke="#d3e0e6"/>
      <text x="410" y="301" font-size="23" font-weight="600">42</text>
      <path d="M507 294H702" fill="none" stroke="#718795" stroke-width="2" marker-end="url(#arrow)"/>
      <rect x="720" y="275" width="308" height="44" rx="5" fill="#e1f1ed" stroke="#80b5a9"/>
      <text x="874" y="304" text-anchor="middle" font-size="21">HistoryHandle → history 42</text>
      <text x="410" y="350" font-size="23">108</text>
      <path d="M507 343H702" fill="none" stroke="#718795" stroke-width="2" marker-end="url(#arrow)"/>
      <text x="738" y="350" font-size="21">HistoryHandle → history 108</text>
      <text x="410" y="399" font-size="23">…</text>
      <text x="738" y="399" font-size="21" fill="#617984">仅包含被修改的 offsets</text>
    </g>

    <g id="cell-history">
      <path d="M1028 297H1060V487H540V517" fill="none" stroke="#718795" stroke-width="2" marker-end="url(#arrow)"/>
      <rect x="28" y="524" width="1044" height="302" rx="10" fill="#fff" stroke="#d3e0e6"/>
      <text x="48" y="564" font-size="23" font-weight="600">history 42：boost::container::deque&lt;VersionEntry&gt;</text>
      <text x="48" y="598" font-size="20" fill="#617984">VersionEntry = (mutation_ts, is_null, value)，按 mutation_ts 追加</text>
      <g text-anchor="middle">
        <rect x="70" y="625" width="270" height="88" rx="7" fill="#e5edf6" stroke="#94abc3"/>
        <text x="205" y="658" font-size="22" font-weight="600">@100</text>
        <text x="205" y="693" font-size="22">count = 20</text>
        <rect x="414" y="625" width="270" height="88" rx="7" fill="#e1f1ed" stroke="#087476" stroke-width="2"/>
        <text x="549" y="658" font-size="22" font-weight="600">@140</text>
        <text x="549" y="693" font-size="22">is_null = true</text>
        <rect x="758" y="625" width="270" height="88" rx="7" fill="#edf2f7" stroke="#a9bdcf"/>
        <text x="893" y="658" font-size="22" font-weight="600">@170</text>
        <text x="893" y="693" font-size="22">count = 25</text>
      </g>
      <path d="M349 669H401" fill="none" stroke="#718795" stroke-width="2" marker-end="url(#arrow)"/>
      <path d="M693 669H745" fill="none" stroke="#718795" stroke-width="2" marker-end="url(#arrow)"/>
      <path d="M549 759V722" fill="none" stroke="#718795" stroke-width="2" marker-end="url(#arrow)"/>
      <text x="549" y="790" text-anchor="middle" font-size="22" font-weight="600" fill="#087476">Q_TS=150 → 最新 ts≤150 的版本 → NULL</text>
    </g>

    <g id="value-representation">
      <rect x="28" y="854" width="1044" height="118" rx="10" fill="#fff" stroke="#d3e0e6"/>
      <text x="48" y="892" font-size="22" font-weight="600">value 的组织</text>
      <text x="48" y="929" font-size="21">INT／BOOL／TIMESTAMPTZ：内联值</text>
      <text x="550" y="929" font-size="21">VARCHAR／ARRAY：共享不可变 Buffer</text>
      <text x="48" y="958" font-size="20" fill="#617984">NULL 是显式版本；没有可见 update 时才回退 base。</text>
    </g>
  </g>
</svg>
