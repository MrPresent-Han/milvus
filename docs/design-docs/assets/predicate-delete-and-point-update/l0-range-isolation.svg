<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="840" viewBox="0 0 1100 840" role="img" aria-labelledby="title desc">
  <title id="title">Phase 1：range 隔离与 C 共同保护 Mix 准入</title>
  <desc id="desc">MixCoord 固定已持久化 M=120，枚举完整 dispatch range (80,120] 的 L0，适用 targets 为 S1、S2。range 与 Mix 原子竞争 targets 的 isCompacting。range 持有两者占用，覆盖全部分发子任务。即使 S1 分发完成并持久化结果，只要 S2 仍执行或重试，涉及 S1 或 S2 的 Mix 都不能准入。全部 targets 分发结果持久化后，先保存 C=120，再释放 range 占用。随后 Mix 取得其 inputs 的 isCompacting，并将输入的 manifest revision 和 deltalog 引用写入 plan，DN 只按序执行这些输入。range/task 记录与 C 证明完整性，isCompacting 提供隔离。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L8 4.5L0 9" fill="none" stroke="#718795" stroke-width="1.6"/></marker>
  </defs>
  <rect width="1100" height="840" rx="12" fill="#f7fafb"/>
  <g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#243e4a">
    <text x="50" y="44" font-size="28" font-weight="600">Range 隔离＋C：整段提交后才放行 Mix</text>
    <text x="50" y="80" font-size="21" fill="#617984">已持久化 M=120 · 完整 (C,E]=(80,120] · targets={S1,S2}</text>

    <rect x="50" y="110" width="1000" height="92" rx="8" fill="white" stroke="#b7cdd6"/>
    <text x="550" y="150" text-anchor="middle" font-size="25" font-weight="600">M gate：选齐 range 的 L0 及 targets，再取得 target 占用</text>
    <text x="550" y="185" text-anchor="middle" font-size="21" fill="#617984">与 Mix input 的 isCompacting 冲突时，整轮延期并重新选择</text>
    <path d="M550 204V231" fill="none" stroke="#718795" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect x="50" y="240" width="1000" height="405" rx="10" fill="#fff5e9" stroke="#c9955e" stroke-width="2"/>
    <text x="550" y="279" text-anchor="middle" font-size="24" font-weight="600" fill="#98613d">Range 持有 S1／S2 的 isCompacting，覆盖全部子任务</text>

    <rect x="90" y="310" width="420" height="95" rx="8" fill="white" stroke="#88b7b4"/>
    <text x="300" y="347" text-anchor="middle" font-size="26" font-weight="600">S1</text>
    <text x="300" y="383" text-anchor="middle" font-size="23" fill="#087476">分发完成，结果已持久化</text>

    <rect x="590" y="310" width="420" height="95" rx="8" fill="white" stroke="#c9955e"/>
    <text x="800" y="347" text-anchor="middle" font-size="26" font-weight="600">S2</text>
    <text x="800" y="383" text-anchor="middle" font-size="23" fill="#98613d">仍在执行／重试</text>

    <rect x="90" y="430" width="920" height="50" rx="6" fill="#f6e5d8"/>
    <text x="550" y="463" text-anchor="middle" font-size="24" font-weight="600" fill="#98613d">Mix(S1)／Mix(S2)／Mix(S1,S2) 均不能准入</text>
    <path d="M550 484V536" fill="none" stroke="#718795" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="400" y="495" width="300" height="31" fill="#fff5e9"/>
    <text x="550" y="518" text-anchor="middle" font-size="21" fill="#617984">直到所有 targets 完成</text>

    <rect x="90" y="545" width="920" height="65" rx="8" fill="#e7f3f1" stroke="#88b7b4"/>
    <text x="550" y="586" text-anchor="middle" font-size="25" font-weight="600" fill="#087476">全部分发结果已持久化 → 保存 C=120</text>

    <path d="M550 647V681" fill="none" stroke="#718795" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="590" y="672" font-size="20" fill="#617984">C 持久化后，释放 range 占用</text>
    <rect x="50" y="690" width="1000" height="85" rx="8" fill="white" stroke="#88b7b4"/>
    <text x="550" y="726" text-anchor="middle" font-size="25" font-weight="600">Mix 取得 input 占用，将输入引用写入 plan</text>
    <text x="550" y="760" text-anchor="middle" font-size="22" fill="#087476">DN 按 plan 读取输入、依序执行 deltas</text>

    <text x="50" y="817" font-size="21" fill="#617984">range／task 记录与 C 证明完整性；isCompacting 隔离分发与 rewrite。</text>
  </g>
</svg>
