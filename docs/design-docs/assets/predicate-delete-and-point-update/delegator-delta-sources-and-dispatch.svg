<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1560" viewBox="0 0 1100 1560" role="img" aria-labelledby="title desc">
  <title id="title">持久化数据与 Delegator buffer 的两条逻辑线</title>
  <desc id="desc">上半图区分两条逻辑线，使用同一组 C、M 和 mutation_ts 时间轴。持久化数据的覆盖职责为：目标 segment 的 base 加 deltalogs 负责截至 C 的前缀，已提交 L0 files 负责 (C,M]，WAL suffix 负责 M 之后。M／C 交接完成后的 Delegator buffer 视图为：截至 C 的历史已交给目标 segment，不再由 Delegator 提供；L0 buffer 提供 (C,M]，streaming buffer 提供 M 之后。C 的回收须在采用含分发结果的 target 后发生；M 的回收须等所需 L0 达到可转发状态。各线的当前取数区间连续且互斥，交接、load pin 与 GC 仍可能暂时保留旧物理副本。下半图保留 Delegator 按操作类型的分发：PK DELETE 与 point UPDATE 解码 PK 做 segment Bloom Filter，predicate DELETE 不求值，按 scope 转发序列化 payload。Growing 与 Sealed 执行层解析 payload 并按序执行。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L8 4.5L0 9" fill="none" stroke="#718795" stroke-width="1.6"/></marker>
    <marker id="teal-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L8 4.5L0 9" fill="none" stroke="#087476" stroke-width="1.6"/></marker>
  </defs>
  <rect width="1100" height="1560" rx="12" fill="#f7fafb"/>
  <g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#243e4a">
    <text x="32" y="45" font-size="28" font-weight="600">Delta 覆盖职责与 buffer 交接：两条逻辑线</text>

    <g id="logical-lines">
      <rect x="24" y="76" width="1052" height="670" rx="10" fill="#fff" stroke="#d3e0e6"/>
      <text x="44" y="115" font-size="24" font-weight="600">① 两条逻辑线：各自按 C／M 划分连续、互斥的区间</text>
      <text x="44" y="149" font-size="20" fill="#617984">示意同一组 C／M（C≤M）；buffer 边界在对应输入 ready 后采用。</text>
      <text x="44" y="202" font-size="22" font-weight="600">mutation_ts</text>
      <path d="M280 208H1055" fill="none" stroke="#718795" stroke-width="2" marker-end="url(#arrow)"/>
      <g text-anchor="middle" font-size="23" font-weight="600" fill="#315e6b">
        <text x="590" y="194">C</text><text x="840" y="194">M</text>
      </g>
      <g fill="none" stroke="#91aab7" stroke-width="1.5" stroke-dasharray="5 5">
        <path d="M590 215V531"/><path d="M840 215V531"/>
      </g>

      <text x="44" y="274" font-size="23" font-weight="600">持久化数据</text>
      <text x="44" y="305" font-size="20" fill="#617984">逻辑覆盖职责</text>
      <g text-anchor="middle">
        <rect id="durable-segment" x="280" y="234" width="310" height="113" fill="#e5edf6" stroke="#94abc3"/>
        <text x="435" y="267" font-size="23" font-weight="600">Segment base</text>
        <text x="435" y="298" font-size="23" font-weight="600">＋ deltalogs</text>
        <text x="435" y="330" font-size="22" fill="#496c76">≤C</text>
        <rect id="durable-l0" x="590" y="234" width="250" height="113" fill="#e1f1ed" stroke="#80b5a9"/>
        <text x="715" y="283" font-size="24" font-weight="600">L0 files</text>
        <text x="715" y="322" font-size="22" fill="#496c76">(C,M]</text>
        <rect id="durable-wal" x="840" y="234" width="214" height="113" fill="#efe9f9" stroke="#b3a0cf"/>
        <text x="947" y="283" font-size="23" font-weight="600">WAL suffix</text>
        <text x="947" y="322" font-size="22" fill="#496c76">>M</text>
      </g>
      <text x="280" y="378" font-size="20" fill="#617984">旧 WAL／L0 文件可延迟 GC；C 只证明分发持久化，不代表 full rewrite 已执行。</text>

      <text x="44" y="454" font-size="23" font-weight="600">Delegator buffer</text>
      <text x="44" y="485" font-size="20" fill="#617984">M／C 交接完成后</text>
      <g text-anchor="middle">
        <rect id="buffer-handed-off" x="280" y="411" width="310" height="113" fill="#f3f5f7" stroke="#c5cfd6"/>
        <text x="435" y="447" font-size="22" fill="#617984">由目标 segment 接管</text>
        <text x="435" y="477" font-size="20" fill="#617984">Delegator 不再提供该前缀</text>
        <text x="435" y="508" font-size="22" fill="#617984">≤C</text>
        <rect id="buffer-l0" x="590" y="411" width="250" height="113" fill="#e1f1ed" stroke="#80b5a9"/>
        <text x="715" y="458" font-size="23" font-weight="600">L0 buffer</text>
        <text x="715" y="499" font-size="22" fill="#496c76">(C,M]</text>
        <rect id="buffer-streaming" x="840" y="411" width="214" height="113" fill="#efe9f9" stroke="#b3a0cf"/>
        <text x="947" y="443" font-size="22" font-weight="600">Streaming</text>
        <text x="947" y="473" font-size="22" font-weight="600">buffer</text>
        <text x="947" y="507" font-size="22" fill="#496c76">>M</text>
      </g>

      <rect x="44" y="556" width="495" height="90" rx="7" fill="#f0f4f7" stroke="#b9cdd7"/>
      <text x="64" y="590" font-size="22" font-weight="600">C 交接：采用含分发结果的 target</text>
      <text x="64" y="624" font-size="21" fill="#496c76">→ 回收 C 完整覆盖的 L0 buffer</text>
      <rect x="559" y="556" width="495" height="90" rx="7" fill="#edf7f5" stroke="#9fc6c2"/>
      <text x="579" y="590" font-size="22" font-weight="600">M 交接：所需 L0 达到可转发状态</text>
      <text x="579" y="624" font-size="21" fill="#496c76">→ 回收已接管的 streaming 前缀</text>
      <text x="44" y="684" font-size="21" fill="#315e6b">正常取数区间互斥且无 hole；交接期间的旧副本由 load pin 保护。</text>
      <text x="44" y="717" font-size="20" fill="#617984">物理副本可延迟释放；统一执行入口按序 apply，并 skip 已完整执行的重复前缀。</text>
    </g>

    <g id="dispatch-paths" transform="translate(0 320)">
    <rect x="24" y="452" width="1052" height="764" rx="10" fill="#fff" stroke="#d3e0e6"/>
    <text x="44" y="493" font-size="24" font-weight="600">② Delegator：按 op_type 选择目标与转发内容</text>
    <rect x="44" y="515" width="1010" height="78" rx="7" fill="#e7f3f1" stroke="#88b7b4"/>
    <text x="549" y="546" text-anchor="middle" font-size="23" font-weight="600">L0 补齐 / WAL streaming → 同一个有序分发入口</text>
    <text x="549" y="575" text-anchor="middle" font-size="20" fill="#496c76">按 mutation_ts 依次 dispatch；类型分支不改变执行顺序</text>
    <path d="M549 594V614H64V914" fill="none" stroke="#718795" stroke-width="2"/>

    <g text-anchor="middle">
      <rect x="89" y="634" width="229" height="80" rx="7" fill="#f0f4f7" stroke="#b9cdd7"/>
      <text x="203" y="668" font-size="24" font-weight="600">PK DELETE</text>
      <text x="203" y="698" font-size="20" fill="#617984">pk + ts</text>
      <rect x="369" y="634" width="640" height="80" rx="7" fill="#f0f4f7" stroke="#b9cdd7"/>
      <text x="689" y="667" font-size="22" font-weight="600">解码 PK → segment BF → 候选 segments</text>
      <text x="689" y="698" font-size="20" fill="#617984">转发：PK + ts</text>

      <rect x="89" y="754" width="229" height="80" rx="7" fill="#edf7f5" stroke="#9fc6c2"/>
      <text x="203" y="788" font-size="24" font-weight="600">Point UPDATE</text>
      <text x="203" y="818" font-size="19" fill="#617984">PK 列表 + assignments</text>
      <rect x="369" y="754" width="640" height="80" rx="7" fill="#edf7f5" stroke="#9fc6c2"/>
      <text x="689" y="787" font-size="22" font-weight="600">逐 PK 检查 BF → 每个 segment 的候选 PK 子集</text>
      <text x="689" y="818" font-size="20" fill="#617984">转发：PK 子集 + 一份 assignments bytes + ts</text>

      <rect x="89" y="874" width="229" height="80" rx="7" fill="#fff4e8" stroke="#d4b38b"/>
      <text x="203" y="908" font-size="23" font-weight="600">Predicate DELETE</text>
      <text x="203" y="938" font-size="20" fill="#617984">predicate + ts</text>
      <rect x="369" y="874" width="640" height="80" rx="7" fill="#fff4e8" stroke="#d4b38b"/>
      <text x="689" y="907" font-size="22" font-weight="600">不求值 predicate → scope 内全部适用 segments</text>
      <text x="689" y="938" font-size="20" fill="#617984">转发：serialized predicate + ts</text>
    </g>
    <g fill="none" stroke="#718795" stroke-width="2" marker-end="url(#arrow)">
      <path d="M64 674H84"/><path d="M64 794H84"/><path d="M64 914H84"/>
      <path d="M319 674H361"/><path d="M319 794H361"/><path d="M319 914H361"/>
    </g>
    <path d="M1010 674H1033V990H293M1010 794H1033M1010 914H1033M802 990V1018" fill="none" stroke="#087476" stroke-width="2.2"/>
    <path d="M293 990V1018" fill="none" stroke="#087476" stroke-width="2.2" marker-end="url(#teal-arrow)"/>
    <path d="M802 990V1018" fill="none" stroke="#087476" stroke-width="2.2" marker-end="url(#teal-arrow)"/>
    <g text-anchor="middle">
      <rect x="44" y="1027" width="498" height="112" rx="7" fill="#e7f3f1" stroke="#88b7b4"/>
      <text x="293" y="1064" font-size="23" font-weight="600">Growing 执行层 · 同一 SN 进程</text>
      <text x="293" y="1097" font-size="21">解析 payload，按序执行</text>
      <text x="293" y="1125" font-size="20" fill="#617984">PK 定位 / predicate 求值 / SET</text>
      <rect x="558" y="1027" width="496" height="112" rx="7" fill="#e7f3f1" stroke="#88b7b4"/>
      <text x="806" y="1064" font-size="23" font-weight="600">Sealed 执行层 · QN Worker</text>
      <text x="806" y="1097" font-size="21">解析 payload，按序执行</text>
      <text x="806" y="1125" font-size="20" fill="#617984">PK 定位 / predicate 求值 / SET</text>
    </g>
    <text x="44" y="1180" font-size="20" fill="#617984">共享 bytes 继续服务后续 load；某个 Growing 已执行，不代表转发缓存可以释放。</text>
    </g>
  </g>
</svg>
