<text x="755.0" y="234" font-size="15" fill="#647c88" font-weight="400" text-anchor="middle">SN 本地 Growing</text>
<text x="755.0" y="258" font-size="15" fill="#647c88" font-weight="400" text-anchor="middle">TransformLog → QN Sealed</text>
<path d="M245,282 L245,310" fill="none" stroke="#6c8791" stroke-width="1.7" marker-end="url(#a)"/>
<path d="M755,282 L755,310" fill="none" stroke="#6c8791" stroke-width="1.7" marker-end="url(#a)"/>
<rect x="30" y="310" width="430" height="84" rx="8" fill="#f5f8fa" stroke="#d6e1e6"/>
