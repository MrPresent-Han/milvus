<path d="M590,96 L710,96" fill="none" stroke="#6c8791" stroke-width="1.7" marker-end="url(#a)"/>
<path d="M800,127 L800,153 L245,153 L245,180" fill="none" stroke="#6c8791" stroke-width="1.7" marker-end="url(#a)"/>
<path d="M800,153 L755,153 L755,180" fill="none" stroke="#6c8791" stroke-width="1.7" marker-end="url(#a)"/>
<rect x="30" y="180" width="430" height="102" rx="8" fill="#edf7f6" stroke="#8dbfbd"/>
