<text x="245.0" y="258" font-size="15" fill="#647c88" font-weight="400" text-anchor="middle">→ Segment deltalogs</text>
<rect x="540" y="180" width="430" height="102" rx="8" fill="#edf5fb" stroke="#9bbad1"/>
