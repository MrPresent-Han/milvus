<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1220" viewBox="0 0 1100 1220" role="img" aria-labelledby="title desc">
  <title id="title">Segment load：固定的历史终点 H 与推进中的 apply 水位 A</title>
  <desc id="desc">上半图展示同一个 segment 的有序 delta 输入。示例历史 (80,150] 包括自带 deltalogs 的 (80,100]、L0 补齐的 (100,120] 和 streaming buffer 加 catch-up 的 (120,150]，随后是 H 之后的实时 UPDATE@160。各来源可并行读取准备，但按 mutation timestamp 有序交付。全部所需历史输入完整入队后，固定 H=150 并加入 distribution，此时不要求历史已执行完成。下半图按实际经过时间 t0、t1、t2 展示同一段历史的执行：t0 的 A=100，历史 (100,150] 待回放；t1 的 A=130，历史 (130,150] 待回放；t2 的 A=150=H，历史回放完成。实时 UPDATE@160 始终排在历史之后，直到 A 追到 H 才能执行。H 不随新实时输入增长，A 只跟踪本次历史 apply；查询准入仍须遵守正文的 TSafe、distribution 和历史完成水位检查。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L8 4.5L0 9" fill="none" stroke="#718795" stroke-width="1.6"/></marker>
    <marker id="apply-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L8 4.5L0 9" fill="none" stroke="#087476" stroke-width="1.6"/></marker>
  </defs>
  <rect width="1100" height="1220" rx="12" fill="#f7fafb"/>
  <g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#243e4a">
    <text x="32" y="44" font-size="28" font-weight="600">Segment load：H 固定输入终点，A 推进历史 apply</text>

    <g id="segment-delta-inputs">
      <rect x="24" y="76" width="1052" height="390" rx="10" fill="#fff" stroke="#d3e0e6"/>
      <text x="44" y="115" font-size="24" font-weight="600">① 同一 segment 的执行序列：历史在前，实时在后</text>
      <text x="44" y="149" font-size="20" fill="#617984">各来源可并行读取与准备，按 mutation_ts 有序交付；以下区间仅为 load 示例。</text>
      <text x="44" y="210" font-size="22" font-weight="600">mutation_ts</text>
      <path d="M280 218H1055" fill="none" stroke="#718795" stroke-width="2" marker-end="url(#arrow)"/>
      <g text-anchor="middle" font-size="21" fill="#496c76">
        <text x="280" y="203">80</text><text x="440" y="203">100</text><text x="600" y="203">120</text>
        <text x="840" y="203" font-weight="600" fill="#315e6b">H=150</text><text x="1000" y="203">170</text>
      </g>
      <text x="44" y="281" font-size="23" font-weight="600">已接收输入</text>
      <text x="44" y="313" font-size="20" fill="#617984">来源按顺序衔接</text>
      <g text-anchor="middle">
        <rect id="input-deltalogs" x="280" y="243" width="160" height="108" fill="#e5edf6" stroke="#94abc3"/>
        <text x="360" y="272" font-size="21" font-weight="600">Segment</text>
        <text x="360" y="300" font-size="21" font-weight="600">deltalogs</text>
        <text x="360" y="333" font-size="20" fill="#496c76">(80,100]</text>
        <rect id="input-l0" x="440" y="243" width="160" height="108" fill="#e1f1ed" stroke="#80b5a9"/>
        <text x="520" y="285" font-size="23" font-weight="600">L0 补齐</text>
        <text x="520" y="326" font-size="20" fill="#496c76">(100,120]</text>
        <rect id="input-buffer" x="600" y="243" width="240" height="108" fill="#efe9f9" stroke="#b3a0cf"/>
        <text x="720" y="272" font-size="21" font-weight="600">Streaming buffer</text>
        <text x="720" y="300" font-size="21" font-weight="600">＋ catch-up</text>
        <text x="720" y="333" font-size="20" fill="#496c76">(120,150]</text>
        <rect id="input-live" x="840" y="243" width="214" height="108" fill="#fff1df" stroke="#d2ad7f"/>
        <text x="947" y="285" font-size="22" font-weight="600">UPDATE@160</text>
        <text x="947" y="326" font-size="20" fill="#946c32">>H 的实时输入</text>
      </g>
      <path d="M840 224V363" fill="none" stroke="#315e6b" stroke-width="2" stroke-dasharray="5 5"/>
      <path d="M280 365V377H840V365" fill="none" stroke="#087476" stroke-width="1.8"/>
      <text x="560" y="408" text-anchor="middle" font-size="22" font-weight="600" fill="#087476">历史输入完整入队 → 固定 H → 加入 distribution</text>
      <text x="44" y="441" font-size="20" fill="#617984">H 证明本次所需历史已到齐，不表示历史已执行完成；后续实时输入接在 H 后。</text>
    </g>

    <g id="apply-progress">
      <rect x="24" y="492" width="1052" height="704" rx="10" fill="#fff" stroke="#d3e0e6"/>
      <text x="44" y="532" font-size="24" font-weight="600">② t0 → t1 → t2：时间向下，A 推进，H 保持 150</text>
      <g font-size="20">
        <rect x="44" y="557" width="22" height="20" fill="#b8dfd0" stroke="#69a994"/>
        <text x="76" y="574" fill="#496c76">已完成 apply</text>
        <rect x="290" y="557" width="22" height="20" fill="#edf2f7" stroke="#a9bdcf"/>
        <text x="322" y="574" fill="#496c76">历史待执行</text>
        <rect x="531" y="557" width="22" height="20" fill="#fff1df" stroke="#d2ad7f"/>
        <text x="563" y="574" fill="#496c76">实时排队</text>
      </g>
      <text x="840" y="614" text-anchor="middle" font-size="22" font-weight="600" fill="#315e6b">H=150（固定）</text>
      <path d="M840 624V1070" fill="none" stroke="#315e6b" stroke-width="1.7" stroke-dasharray="5 5"/>

      <g id="stage-t0">
        <text x="44" y="684" font-size="23" font-weight="600">t0：交接完成</text>
        <text x="44" y="716" font-size="20" fill="#617984">A=100，H=150</text>
        <rect id="t0-applied" x="280" y="654" width="160" height="60" fill="#b8dfd0" stroke="#69a994"/>
        <rect id="t0-pending" x="440" y="654" width="400" height="60" fill="#edf2f7" stroke="#a9bdcf"/>
        <rect id="t0-live" x="840" y="654" width="214" height="60" fill="#fff1df" stroke="#d2ad7f"/>
        <text x="360" y="691" text-anchor="middle" font-size="21">已 apply</text>
        <text x="640" y="691" text-anchor="middle" font-size="21">待回放 (100,150]</text>
        <text x="947" y="691" text-anchor="middle" font-size="21" fill="#946c32">@160 排队</text>
        <text x="440" y="641" text-anchor="middle" font-size="22" font-weight="600" fill="#087476">A=100</text>
        <path d="M440 646V720" fill="none" stroke="#087476" stroke-width="2.2"/>
        <text x="280" y="747" font-size="20" fill="#617984">已加入 distribution；历史仍待执行，@160 等待。</text>
      </g>

      <g id="stage-t1">
        <text x="44" y="834" font-size="23" font-weight="600">t1：历史回放中</text>
        <text x="44" y="866" font-size="20" fill="#617984">A=130，H=150</text>
        <rect id="t1-applied" x="280" y="804" width="400" height="60" fill="#b8dfd0" stroke="#69a994"/>
        <rect id="t1-pending" x="680" y="804" width="160" height="60" fill="#edf2f7" stroke="#a9bdcf"/>
        <rect id="t1-live" x="840" y="804" width="214" height="60" fill="#fff1df" stroke="#d2ad7f"/>
        <text x="480" y="841" text-anchor="middle" font-size="21">已 apply 至 130</text>
        <text x="760" y="840" text-anchor="middle" font-size="19">(130,150]</text>
        <text x="947" y="841" text-anchor="middle" font-size="21" fill="#946c32">@160 排队</text>
        <text x="680" y="791" text-anchor="middle" font-size="22" font-weight="600" fill="#087476">A=130</text>
        <path d="M680 796V870" fill="none" stroke="#087476" stroke-width="2.2"/>
        <text x="280" y="897" font-size="20" fill="#617984">A 只随实际执行完成推进，已入队不计作已 apply。</text>
      </g>

      <g id="stage-t2">
        <text x="44" y="984" font-size="23" font-weight="600">t2：历史完成</text>
        <text x="44" y="1016" font-size="20" fill="#617984">A=H=150</text>
        <rect id="t2-applied" x="280" y="954" width="560" height="60" fill="#b8dfd0" stroke="#69a994"/>
        <rect id="t2-live" x="840" y="954" width="214" height="60" fill="#e1f1ed" stroke="#80b5a9"/>
        <text x="560" y="991" text-anchor="middle" font-size="22" font-weight="600">所需历史全部执行完成</text>
        <text x="947" y="991" text-anchor="middle" font-size="21" fill="#087476">@160 可执行</text>
        <text x="828" y="941" text-anchor="end" font-size="22" font-weight="600" fill="#087476">A=H=150</text>
        <path d="M840 946V1020" fill="none" stroke="#087476" stroke-width="2.2"/>
        <text x="280" y="1047" font-size="20" fill="#617984">历史队首清空，后续实时操作开始执行。</text>
      </g>

      <path d="M280 1080H1054" fill="none" stroke="#d3e0e6" stroke-width="1"/>
      <text x="44" y="1113" font-size="21" fill="#315e6b">H 不随新实时输入增长；A 只跟踪本次历史，追到 H 即完成。</text>
      <text x="44" y="1147" font-size="20" fill="#617984">A／H 是 query side 本次 load 的内存状态，不是 M／C 或 etcd 进度。</text>
      <text x="44" y="1180" font-size="20" fill="#617984">加入 distribution 不等于查询已就绪；查询仍按 §5.4.2 检查 TSafe、distribution 与 A。</text>
    </g>
  </g>
</svg>
