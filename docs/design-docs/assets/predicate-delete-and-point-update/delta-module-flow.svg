<text x="755.0" y="357" font-size="15" fill="#647c88" font-weight="400" text-anchor="middle">每 VChannel 共享；本地 scope / PK BF</text>
<text x="755.0" y="381" font-size="15" fill="#647c88" font-weight="400" text-anchor="middle">predicate 交给适用 segments 执行</text>
