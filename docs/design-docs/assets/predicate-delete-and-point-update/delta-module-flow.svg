<text x="245.0" y="573" font-size="15" fill="#647c88" font-weight="400" text-anchor="middle">只选 cursor 已对齐的 inputs，持有 input 占用</text>
<text x="245.0" y="597" font-size="15" fill="#647c88" font-weight="400" text-anchor="middle">各 input 按序执行 pending deltas</text>
<rect x="540" y="519" width="430" height="88" rx="8" fill="#f5f8fa" stroke="#d6e1e6"/>
<text x="755.0" y="547" font-size="18" fill="#243f4d" font-weight="650" text-anchor="middle">UpdatesRecord / DeletedRecord</text>
<text x="755.0" y="573" font-size="15" fill="#647c88" font-weight="400" text-anchor="middle">更新值与删除状态叠加原 base/index</text>
<path d="M245,607 L245,634" fill="none" stroke="#6c8791" stroke-width="1.7" marker-end="url(#a)"/>
<path d="M755,607 L755,634" fill="none" stroke="#6c8791" stroke-width="1.7" marker-end="url(#a)"/>
<rect x="30" y="634" width="430" height="88" rx="8" fill="#f5f8fa" stroke="#d6e1e6"/>
<text x="245.0" y="662" font-size="18" fill="#243f4d" font-weight="650" text-anchor="middle">compactTo segment</text>
<text x="245.0" y="688" font-size="15" fill="#647c88" font-weight="400" text-anchor="middle">存活行 + 新 base；cursor = E</text>
<text x="245.0" y="712" font-size="15" fill="#647c88" font-weight="400" text-anchor="middle">后续只接续 &gt; E</text>
<rect x="540" y="634" width="430" height="88" rx="8" fill="#f5f8fa" stroke="#d6e1e6"/>
<text x="755.0" y="662" font-size="18" fill="#243f4d" font-weight="650" text-anchor="middle">QueryView 查询</text>
<text x="755.0" y="688" font-size="15" fill="#647c88" font-weight="400" text-anchor="middle">pin physical segment</text>
<text x="755.0" y="712" font-size="15" fill="#647c88" font-weight="400" text-anchor="middle">等待所需 transform apply，再按 Q_TS 读取</text>
<path d="M460,679 L500,679 L500,454 L540,454" fill="none" stroke="#6c8791" stroke-width="1.7" marker-end="url(#a)"/>
<text x="490" y="780" font-size="16" fill="#647c88" font-weight="400" text-anchor="middle">新 base 与匹配 cursor 一起加载；历史后缀来自 TransformLog</text>
