<text x="245.0" y="244" font-size="15" fill="#647c88" font-weight="400" text-anchor="middle">有 delta 写 L0 files；空区间不写文件</text>
<text x="245.0" y="268" font-size="15" fill="#647c88" font-weight="400" text-anchor="middle">完整覆盖全部 scopes → 持久化 M</text>
