<path d="M500,130 L500,152 L245,152 L245,190" fill="none" stroke="#6c8791" stroke-width="1.7" marker-end="url(#a)"/>
<path d="M500,130 L500,152 L755,152 L755,190" fill="none" stroke="#6c8791" stroke-width="1.7" marker-end="url(#a)"/>
